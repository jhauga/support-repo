<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Rhythm</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <main>
    <header>
      <h1>Grid Rhythm</h1>
      <p class="step-label" id="stepLabel">Step 1 of 3: Size</p>
    </header>

    <section id="step-1" data-step="1">
      <label>Rows (1 to 20)
        <input id="rows" type="number" min="1" max="20" step="1" value="4">
      </label>
      <label>Columns (1 to 10)
        <input id="cols" type="number" min="1" max="10" step="1" value="6">
      </label>
      <p class="error" id="sizeError" role="alert"></p>
      <div class="buttons">
        <button type="button" id="nextSize">Next</button>
      </div>
    </section>

    <section id="step-2" data-step="2" hidden>
      <fieldset>
        <legend>Pattern mode</legend>
        <label class="choice">
          <input type="radio" name="pattern" value="row" checked>
          <span><strong>One row pattern</strong> every row repeats the same shape sequence</span>
        </label>
        <label class="choice">
          <input type="radio" name="pattern" value="alternating">
          <span><strong>Alternating rows</strong> odd and even rows read the sequence in opposite directions</span>
        </label>
      </fieldset>
      <div class="buttons">
        <button type="button" class="secondary" data-back="1">Back</button>
        <button type="button" id="nextPattern">Next</button>
      </div>
    </section>

    <section id="step-3" data-step="3" hidden>
      <fieldset>
        <legend>Shapes in the sequence</legend>
        <label class="inline"><input type="checkbox" name="shape" value="square" checked> Square</label>
        <label class="inline"><input type="checkbox" name="shape" value="circle" checked> Circle</label>
        <label class="inline"><input type="checkbox" name="shape" value="rectangle" checked> Rectangle</label>
        <label class="inline"><input type="checkbox" name="shape" value="ellipse" checked> Ellipse</label>
        <label class="inline"><input type="checkbox" name="shape" value="asset"> Linked asset (accent)</label>
      </fieldset>
      <label>Fill rhythm
        <select id="fillMode">
          <option value="step" selected>Step through the palette</option>
          <option value="mirror">Mirror across the columns</option>
        </select>
      </label>
      <label>Rotate each cell by
        <select id="rotateStep">
          <option value="0" selected>0 degrees (none)</option>
          <option value="15">15 degrees</option>
          <option value="30">30 degrees</option>
          <option value="45">45 degrees</option>
          <option value="90">90 degrees</option>
        </select>
      </label>
      <label>Stroke weight (pt, 0 for none; rows cycle 1x, 2x, 3x)
        <input id="strokeWeight" type="number" min="0" max="12" step="0.5" value="1">
      </label>
      <label class="inline">
        <input type="checkbox" id="dashAlternate" checked> Dash the stroke on odd rows
      </label>

      <div class="preview">
        <svg id="preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" role="img" aria-label="Preview of the first four rows"></svg>
        <p class="hint">Preview of the first 4 rows</p>
      </div>

      <p class="error" id="designError" role="alert"></p>
      <p class="status" id="status" role="status"></p>
      <div class="buttons">
        <button type="button" class="secondary" data-back="2">Back</button>
        <button type="button" id="draw">Draw</button>
      </div>
    </section>
  </main>

  <script src="js/CSInterface.js"></script>
  <script src="js/rhythm-plan.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
