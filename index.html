 <style>
  body {
   margin-left: 50px;
  }
  div, nav, ul, li, a {
   display: inline-block;
   position: relative;
   box-sizing: border-box;
  }
  div, nav, footer {
   width: 100%;
  }
  nav {
   background: black;   
   height: 60px;
  }
  nav ul li a {
   color: white;
   padding: 10px;
  }
  main {
   margin: 30px;
  }
  button {
   background: darkslategray;
   color: white;     
   margin: 10px;
   padding: 15px;
   cursor: pointer;
   border-radius: 10px;
  }
  button.showHide {
   display: block; 
   background: black;
   color: white;
  }
  button.showHide.black {
   display: block; 
   padding: 2px;
  }  
  button.showHide.gray {
   display: block; 
   background: darkslategray;
   padding: 2px;
  }    
  span.key {
   color: #0073e6;
  }  
  span.str {
   color: orange;
  }
  span.int {
   color: green;
  }
  span.mthd {
   color: purple;
  }
  em {
   color: dimgray;
  }  
  footer {
   bottom: 0px;   
   background: black;
   color: white;
   margin-left: -50px; 
   padding: 50px;
  }
 </style>
</head>
